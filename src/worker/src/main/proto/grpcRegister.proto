syntax = "proto3";

package register;

message RegisterRequest {
    string ip   = 1;  // worker IP
    int32  port = 2;  // worker의 gRPC listen 포트 (shuffle용)
}

message RegisterResponse {
    int32 worker_id    = 1; // 마스터가 부여한 ID (1..N)
    int32 worker_count = 2; // 전체 워커 수 (N)
}

service RegisterService {
    // 단순한 unary RPC 한 번으로 등록을 끝낸다.
    rpc Register(RegisterRequest) returns (RegisterResponse);
}
